name: Update Portfolio Projects

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: 24AIML048-Vidhi
        run: |
          python scripts/generate_projects.py

      - name: Check generated file
        run: |
          cat public/projects.json

      - name: Commit updated projects.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/projects.json

          if git diff --cached --quiet; then
            echo "No changes to projects.json"
          else
            git commit -m "chore: update GitHub projects"
            git push
          fi